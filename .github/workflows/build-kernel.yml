name: Build Kernel
run-name: ${{ inputs.input-run-name }}

on:
  workflow_dispatch:
    inputs:
      input-run-name:
        description: 'Run name (for internal use, optional)'
        required: false
        default: 'Manual Run'
      ksu:
        description: 'ReSukiSU?'
        required: false
        type: choice
        options:
          - Include
          - Exclude
          - Both
        default: Include
      build:
        description: 'Output format'
        required: false
        type: choice
        options:
          - anykernel
          - magisk
          - both
        default: anykernel
      jobs:
        description: 'Parallel jobs'
        required: false
        default: '24'

jobs:
  matrix-setup:
    runs-on: ubuntu-26.04
    outputs:
      ksu_check: ${{ steps.set-matrix.outputs.ksu_check }}
      builds: ${{ steps.set-matrix.outputs.builds }}
    steps:
      - name: Set matrix variables
        id: set-matrix
        run: |
          if [ "${{ inputs.ksu }}" = "Both" ]; then
            echo 'ksu_check=["Include","Exclude"]' >> "$GITHUB_OUTPUT"
          else
            echo 'ksu_check=["${{ inputs.ksu }}"]' >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ inputs.build }}" = "both" ]; then
            echo 'builds=["anykernel","magisk"]' >> "$GITHUB_OUTPUT"
          else
            echo 'builds=["${{ inputs.build }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix-setup
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      matrix:
        ksu: ${{ fromJson(needs.matrix-setup.outputs.ksu_check) }}
        build: ${{ fromJson(needs.matrix-setup.outputs.builds) }}
        exclude:
          - build: magisk
            ksu: Include
      fail-fast: false

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl wget \
            build-essential gcc make \
            bc bison flex \
            libssl-dev libelf-dev \
            libncurses5-dev \
            python3 \
            zip unzip \
            cpio \
            ccache \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            lld \
            rsync \
            clang

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.ksu }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.ksu }}-

      - name: Download Neutron Clang
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: Git Clone AnyKernel3/Magisk kernel installer
        run: |
          git clone --depth 1 --branch "${{ matrix.build }}" https://github.com/sidex15/n3x7g3n_anykernel3

      - name: Build kernel
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          ksu_flag=""
          if [ "${{ matrix.ksu }}" = "Include" ]; then
            ksu_flag="--ksu"
          fi
          bash ./build_kernel_docker_quick.sh \
            --variant mh2lm \
            $ksu_flag \
            --jobs "${{ inputs.jobs }}" \
            --build "${{ matrix.build }}" \
            --clang-path "$HOME/toolchains/neutron-clang/bin"

      - name: Copy built kernel to anykernel/magisk directory
        run: |
          build="${{ matrix.build }}"
          ksu="${{ matrix.ksu }}"

          if [ "$build" = "magisk" ]; then
            cp "release/Dragon/Image-mh2lm.gz-dtb" "n3x7g3n_anykernel3/Image.gz-dtb"
          else
            cp "release/Dragon/Image-mh2lm" "n3x7g3n_anykernel3/Image"
            sed -i "s/#             LG <device>             #/#            LG V50s-G8x              #/g" n3x7g3n_anykernel3/banner
            if [ "$ksu" = "Include" ]; then
              sed -i "s/#           n3x7g3n kernel            #/#    n3x7g3n kernel (ReSukiSU + SUSFS)    #/g" n3x7g3n_anykernel3/banner
            fi
          fi

      - name: Determine artifact paths
        id: artifacts
        run: |
          build="${{ matrix.build }}"

          ksu_flag=""
          if [ "${{ matrix.ksu }}" = "Include" ]; then
            ksu_flag="KSU"
          else
            ksu_flag="LineageOS"
          fi

          if [ "$build" = "magisk" ]; then
            artifact_path="release/Dragon/Image-mh2lm.gz-dtb"
            build_suffix="magisk"
          else
            artifact_path="release/Dragon/Image-mh2lm"
            build_suffix="anykernel3"
          fi

          echo "artifact_path=${artifact_path}" >> "$GITHUB_OUTPUT"
          echo "image_name=Image-mh2lm" >> "$GITHUB_OUTPUT"
          echo "device_codename=V50s-G8x" >> "$GITHUB_OUTPUT"
          echo "ksu_flag=${ksu_flag}" >> "$GITHUB_OUTPUT"
          echo "build_suffix=${build_suffix}" >> "$GITHUB_OUTPUT"

      - name: Upload anykernel/magisk artifact
        uses: actions/upload-artifact@v4
        with:
          name: "V50s-G8x-lineageos-${{ steps.artifacts.outputs.build_suffix }}-${{ steps.artifacts.outputs.ksu_flag }}"
          path: n3x7g3n_anykernel3/
          if-no-files-found: error
          retention-days: 30
